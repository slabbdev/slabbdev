<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="NoireBox — the flight data recorder for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0e13"/>
      <stop offset="1" stop-color="#171219"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beaconGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="boxClip">
      <rect x="1060" y="300" width="380" height="320" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint stars -->
  <g fill="#ffffff">
    <circle cx="240" cy="120" r="1.6" opacity="0.12"/>
    <circle cx="520" cy="80"  r="1.2" opacity="0.10"/>
    <circle cx="820" cy="150" r="1.4" opacity="0.12"/>
    <circle cx="980" cy="90"  r="1.2" opacity="0.09"/>
    <circle cx="640" cy="640" r="1.5" opacity="0.10"/>
    <circle cx="180" cy="560" r="1.2" opacity="0.08"/>
    <circle cx="440" cy="720" r="1.4" opacity="0.09"/>
    <circle cx="1080" cy="120" r="1.3" opacity="0.10"/>
  </g>

  <!-- ghost panels behind the box -->
  <g>
    <rect x="1372" y="158" width="192" height="132" rx="14" fill="#0f1015" stroke="#23252d" stroke-width="2"/>
    <circle cx="1394" cy="178" r="4" fill="#2c2f38"/>
    <circle cx="1408" cy="178" r="4" fill="#2c2f38"/>
    <circle cx="1422" cy="178" r="4" fill="#2c2f38"/>
    <rect x="1392" y="200" width="110" height="10" rx="5" fill="#1a1c23"/>
    <rect x="1392" y="222" width="150" height="10" rx="5" fill="#1a1c23"/>
    <rect x="1392" y="244" width="90"  height="10" rx="5" fill="#1a1c23"/>
  </g>
  <g>
    <rect x="1428" y="520" width="172" height="122" rx="14" fill="#0f1015" stroke="#23252d" stroke-width="2"/>
    <circle cx="1450" cy="540" r="4" fill="#2c2f38"/>
    <circle cx="1464" cy="540" r="4" fill="#2c2f38"/>
    <circle cx="1478" cy="540" r="4" fill="#2c2f38"/>
    <rect x="1448" y="562" width="120" height="10" rx="5" fill="#1a1c23"/>
    <rect x="1448" y="584" width="90"  height="10" rx="5" fill="#1a1c23"/>
  </g>

  <!-- amber glow behind the box -->
  <ellipse cx="1250" cy="470" rx="340" ry="270" fill="url(#glow)"/>

  <!-- wires with nodes -->
  <g fill="none" stroke-linecap="round">
    <path d="M 1060 400 C 990 400 990 468 922 468" stroke="#f5a623" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M 1060 470 C 1012 470 1012 530 952 530" stroke="#52525b" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M 1380 560 C 1408 572 1408 580 1426 588" stroke="#52525b" stroke-opacity="0.45" stroke-width="3"/>
  </g>
  <circle cx="922" cy="468" r="6" fill="#f5a623" opacity="0.8"/>
  <circle cx="952" cy="530" r="5" fill="#52525b" opacity="0.7"/>
  <circle cx="1426" cy="588" r="5" fill="#52525b" opacity="0.7"/>

  <!-- the black box -->
  <g>
    <circle cx="1250" cy="242" r="46" fill="url(#beaconGlow)"/>
    <line x1="1250" y1="300" x2="1250" y2="256" stroke="#3a3d47" stroke-width="4"/>
    <circle cx="1250" cy="242" r="24" fill="none" stroke="#f5a623" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="1250" cy="242" r="34" fill="none" stroke="#f5a623" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="1060" y="300" width="380" height="320" rx="26" fill="#0b0b0f" stroke="#2a2c35" stroke-width="3"/>

    <g clip-path="url(#boxClip)">
      <g>
        <rect x="1060" y="592" width="38" height="28" fill="#f59e0b"/>
        <rect x="1098" y="592" width="38" height="28" fill="#f6f1e6"/>
        <rect x="1136" y="592" width="38" height="28" fill="#f59e0b"/>
        <rect x="1174" y="592" width="38" height="28" fill="#f6f1e6"/>
        <rect x="1212" y="592" width="38" height="28" fill="#f59e0b"/>
        <rect x="1250" y="592" width="38" height="28" fill="#f6f1e6"/>
        <rect x="1288" y="592" width="38" height="28" fill="#f59e0b"/>
        <rect x="1326" y="592" width="38" height="28" fill="#f6f1e6"/>
        <rect x="1364" y="592" width="38" height="28" fill="#f59e0b"/>
        <rect x="1402" y="592" width="38" height="28" fill="#f6f1e6"/>
      </g>
    </g>

    <circle cx="1092" cy="332" r="7" fill="#3a3d47"/>
    <circle cx="1408" cy="332" r="7" fill="#3a3d47"/>
    <circle cx="1092" cy="560" r="7" fill="#3a3d47"/>
    <circle cx="1408" cy="560" r="7" fill="#3a3d47"/>

    <text x="1250" y="356" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" letter-spacing="5" fill="#f5a623" opacity="0.85">FLIGHT DATA RECORDER</text>

    <g fill="#232630">
      <rect x="1100" y="386" width="300" height="18" rx="6"/>
      <rect x="1100" y="418" width="240" height="18" rx="6"/>
      <rect x="1100" y="450" width="280" height="18" rx="6"/>
      <rect x="1100" y="482" width="200" height="18" rx="6"/>
    </g>
    <rect x="1408" y="418" width="22" height="18" rx="6" fill="#f5a623" opacity="0.9"/>
  </g>

  <!-- left text block -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="84" y="248" font-size="168" font-weight="800" letter-spacing="2">
      <tspan fill="#fafafa">NOIRE</tspan><tspan fill="#f5a623">BOX</tspan>
    </text>
    <text x="88" y="336" font-size="54" fill="#d4d4d8">The flight data recorder for <tspan fill="#f5a623" font-weight="700">AI agents.</tspan></text>

    <rect x="84" y="388" width="700" height="64" rx="32" fill="#1a1b20" stroke="#3f3f46" stroke-width="2"/>
    <text x="122" y="431" font-size="27" letter-spacing="5" fill="#c8c9cf">HASH-CHAINED · ED25519 · RFC 3161</text>

    <line x1="86" y1="772" x2="120" y2="772" stroke="#71717a" stroke-width="3"/>
    <text x="84" y="826" font-size="33" fill="#a1a1aa">Tamper with it — verification explodes.</text>
  </g>
</svg>
